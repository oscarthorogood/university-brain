# Push a tag like v1.2.0 and this builds the app, packs a DMG and publishes it as a GitHub Release.
# The app's updater reads the latest release, so publishing is all an update needs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release

jobs:
  dmg:
    runs-on: macos-26   # the app needs the macOS 26 SDK (Xcode 26, Swift 6.2)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bundle.sh counts commits for the build number

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" ./bundle.sh

      - name: Make the disk image
        run: ./make-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/UniversityBrain-*.dmg build/UniversityBrain-*.dmg.sha256 \
            --title "University Brain ${GITHUB_REF_NAME#v}" --generate-notes
